# Opt-in compose overlay that enables the Strata engine as a managed chat
# backend — see backend/qwen3.8-flash-next-coder-iq1_m.yaml (text) and
# backend/qwen3.8-flash-next-coder-iq1_m-vision.yaml (picture reading) for
# the model entries.
#
# Usage:
#   ./scripts/deploy.sh            # includes strata by default (auto-skips
#                                  # on machines without the files)
#   or directly:
#   docker compose -f docker-compose.yml -f docker-compose.strata.yml up -d
#
# What is mounted:
#   * The Strata install (STRATA_HOME, default $HOME/.local/share/strata:
#     the terminal bundle with the `strata` launcher and the engine
#     components) — read-only, at a FIXED container path
#     (/opt/strata/.local/share/strata). The backend process runs as root
#     in the container, and Strata resolves its install via $HOME — the
#     model YAMLs pin HOME to /opt/strata for exactly this reason. Keeping
#     the container side fixed (while the host side adapts to whoever
#     installed Strata) means no username appears anywhere in the model
#     YAMLs, like the /opt/... paths of the llama.cpp backends.
#   * The model disk (STRATA_MODELS, default /opt/models — the same shared
#     model root as every other backend: shards, STRATA pack, MTP, mmproj)
#     — read-only, mounted at the same /opt/models path the YAML args
#     reference. Point STRATA_MODELS elsewhere (e.g. a dedicated data
#     disk) if the Strata weights live outside the shared root; the
#     container-side target stays /opt/models either way.
#
# Deploy-time values the registry YAMLs expand (${STRATA_TERMINAL_VERSION},
# ${STRATA_ENGINE_DIR} — see app/registry.py): deploy.sh sniffs both off
# the installed bundle and exports them; without deploy.sh, the image's
# entrypoint (scripts/docker-entrypoint.sh) sniffs the same values at
# container start. There are no hardcoded version defaults.
#
# Inside the container, paths must reference the VERSIONED terminal dir
# (terminal/<version>), never terminal/current: that symlink carries an
# ABSOLUTE host path (<home>/<user>/...) that does not exist here.
#
# Strata's own state (launch records, engine logs under
# LLAMASWAP_LLM_TMP_DIR) lands on the container's writable layer; nothing
# in the mounts is written.
#
# NOTE: the standalone Strata instance (strata serve on :8081) holds the
# same ~15.2 GiB this backend needs. Stop it before loading the model
# through llamaswap, and point its clients (e.g. opencode's `strata`
# provider, http://localhost:8081/v1) at llamaswap's published port
# instead — the proxy then boots/stops Strata per demand:
#   pkill -f "strata serve"
services:
  llamaswap:
    environment:
      # The IQ1_M pack reloads in ~2.5 min warm (135 s measured), but the
      # FIRST boot after a reboot is much slower (cold page cache; 807 s
      # once measured while the weights still lived on a WSL drive mount)
      # — over the base 600 s ceiling, so the strata deployment raises it.
      # Idle unload is unchanged (the models themselves override it with
      # meta.idle_unload_seconds).
      LLAMASWAP_STARTUP_TIMEOUT: "${LLAMASWAP_STARTUP_TIMEOUT:-1800}"
      # Deploy-time pins for the registry YAMLs' ${...} env expansion.
      # deploy.sh exports the sniffed values; direct stacked compose users
      # get them from the image entrypoint's sniff (scripts/
      # docker-entrypoint.sh) — hence the empty pass-through defaults.
      STRATA_TERMINAL_VERSION: "${STRATA_TERMINAL_VERSION:-}"
      STRATA_ENGINE_DIR: "${STRATA_ENGINE_DIR:-}"
    volumes:
      # Strata terminal bundle + engine components (ro, fixed container
      # path; host side adapts via STRATA_HOME)
      - ${STRATA_HOME:-$HOME/.local/share/strata}:/opt/strata/.local/share/strata:ro
      # Model weights: shards, STRATA packs, MTP, mmproj (ro, fixed
      # container path; host side adapts via STRATA_MODELS — by default the
      # shared /opt/models root, which the base compose already mounts; the
      # explicit entry lets STRATA_MODELS point at a different disk).
      # deploy.sh exports STRATA_MODELS=$MODEL_ROOT automatically; direct
      # hub+strata users with a relocated MODEL_ROOT must set
      # STRATA_MODELS to match (compose cannot chain the two defaults).
      - ${STRATA_MODELS:-/opt/models}:/opt/models:ro
