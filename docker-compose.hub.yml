# Run llamaswap directly from the Docker Hub image (no local build):
#
#   docker compose -f docker-compose.hub.yml up -d
#
# The published image (docker.io/adelnazmy2002/llamaswap:latest) already
# contains the audio/image overlay binaries — audiocpp_server (TTS/ASR/music,
# incl. minimax_music3), whisper-server and sd-server (FLUX + Qwen-Image 2.1)
# — so no opt-in overlays are needed and nothing is compiled locally.
#
# What is NOT in the image: model weights (~30 GB). Same as the local
# deployment, they live in /opt/models on the host; point the volume at an
# existing copy or let the models-init one-shot download the default
# TTS/ASR/music bundle set:
#
#   docker compose -f docker-compose.hub.yml run --rm models-init
#
# Strata engine: included in this file — nothing to layer, nothing to
# build (Strata is runtime-only). Two host requirements:
#
#   1. a Strata install at ~/.local/share/strata (override: STRATA_HOME).
#      It is bind-mounted read-only at the fixed container path
#      /opt/strata/.local/share/strata; the entrypoint sniffs the installed
#      version pins at startup (no deploy.sh needed).
#   2. the Strata weights (shards, pack, MTP, mmproj) under /opt/models,
#      the same shared model root as every other backend:
#      /opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/...
#
# Without an install the container runs fine — docker creates an empty dir
# and the two strata models sit unusable in the registry. Stop any
# standalone `strata serve` first: it holds the same ~15.2 GiB of VRAM.
#
# IMAGE STALENESS: the published image must be newer than the Strata
# backend configs, the registry ${...} env expansion (app/registry.py) and
# the entrypoint. To keep a checkout working even when the Hub image lags,
# this file overlays the checkout's app/, backend/ and entrypoint onto the
# image (no rebuild, binaries stay from the image). An old image without
# that overlay logs
# `binary not found: /opt/strata/.../${STRATA_TERMINAL_VERSION}...`
# warnings; republishing the image remains the fix for consumers who do
# not run from a checkout.
#
# Requirements: Docker with the NVIDIA container runtime (the container
# reserves all GPUs for CUDA backends) and the model weights volume.

services:
  llamaswap:
    # Same image that adelnazmy2002/llamaswap:latest publishes —
    # pulled from Docker Hub, never built locally.
    image: adelnazmy2002/llamaswap:latest
    # Use the checkout's entrypoint (the published image may predate it);
    # it sniffs the Strata version pins off the mounted install. Compose
    # clears the image CMD when an entrypoint is set, so repeat it here.
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "11434"]
    init: true
    container_name: llamaswap
    restart: unless-stopped
    ports:
      # Published twice: the repo-default port (overridable via
      # LLAMASWAP_PORT) plus the legacy graphify port 9090. The container
      # itself always listens on 11434.
      - ${LLAMASWAP_PORT:-11434}:11434
      - 9090:11434
      - 1234:11434
    environment:
      LLAMASWAP_HOST: "${LLAMASWAP_HOST:-0.0.0.0}"
      LLAMASWAP_PORT: "${LLAMASWAP_PORT:-11434}"
      LLAMASWAP_BACKEND_DIR: "${LLAMASWAP_BACKEND_DIR:-backend}"
      # Raised over the 600 s app default to cover the Strata pack's cold
      # first load (~13 min after a reboot); every other backend loads in
      # seconds, so an inflated ceiling is harmless.
      LLAMASWAP_STARTUP_TIMEOUT: "${LLAMASWAP_STARTUP_TIMEOUT:-1800.0}"
      LLAMASWAP_STOP_TIMEOUT: "${LLAMASWAP_STOP_TIMEOUT:-30.0}"
      LLAMASWAP_HEALTH_INTERVAL: "${LLAMASWAP_HEALTH_INTERVAL:-1.0}"
      # Unload the chat LLM AND audio (tts/asr) servers after this many
      # idle seconds; only the embedding server stays up.
      LLAMASWAP_IDLE_UNLOAD_SECONDS: "${LLAMASWAP_IDLE_UNLOAD_SECONDS:-300}"
      LLAMASWAP_IDLE_UNLOAD_AUDIO_SECONDS: "${LLAMASWAP_IDLE_UNLOAD_AUDIO_SECONDS:-}"
      LLAMASWAP_IDLE_UNLOAD_IMAGE_SECONDS: "${LLAMASWAP_IDLE_UNLOAD_IMAGE_SECONDS:-}"
      LLAMASWAP_IDLE_UNLOAD_MUSIC_SECONDS: "${LLAMASWAP_IDLE_UNLOAD_MUSIC_SECONDS:-}"
      # While tts AND asr are both loaded, serve only the smallest chat
      # LLM (weights-file size) instead of the requested one.
      LLAMASWAP_AUDIO_VRAM_GUARD: "${LLAMASWAP_AUDIO_VRAM_GUARD:-true}"
      # Reject TTS/ASR (409) while a big chat LLM (anything other than the
      # smallest by weights-file size) is loaded.
      LLAMASWAP_BLOCK_AUDIO_ON_BIG_LLM: "${LLAMASWAP_BLOCK_AUDIO_ON_BIG_LLM:-true}"
      # Unload TTS/ASR when a big chat LLM is requested (embedding stays up).
      LLAMASWAP_UNLOAD_AUDIO_ON_BIG_LLM: "${LLAMASWAP_UNLOAD_AUDIO_ON_BIG_LLM:-true}"
      LLAMASWAP_UNLOAD_ON_IMAGE: "${LLAMASWAP_UNLOAD_ON_IMAGE:-true}"
      LLAMASWAP_UNLOAD_IMAGE_ON_LLM: "${LLAMASWAP_UNLOAD_IMAGE_ON_LLM:-true}"
      LLAMASWAP_UNLOAD_IMAGE_ON_AUDIO: "${LLAMASWAP_UNLOAD_IMAGE_ON_AUDIO:-true}"
      LLAMASWAP_UNLOAD_ON_MUSIC: "${LLAMASWAP_UNLOAD_ON_MUSIC:-true}"
      LLAMASWAP_UNLOAD_MUSIC_ON_LLM: "${LLAMASWAP_UNLOAD_MUSIC_ON_LLM:-true}"
      LLAMASWAP_UNLOAD_MUSIC_ON_AUDIO: "${LLAMASWAP_UNLOAD_MUSIC_ON_AUDIO:-true}"
      LLAMASWAP_UNLOAD_IMAGE_ON_MUSIC: "${LLAMASWAP_UNLOAD_IMAGE_ON_MUSIC:-true}"
      LLAMASWAP_EMBEDDING_AUTO_START: "${LLAMASWAP_EMBEDDING_AUTO_START:-false}"
      LLAMASWAP_LOG_LEVEL: "${LLAMASWAP_LOG_LEVEL:-INFO}"
      LLAMASWAP_LOG_JSON: "${LLAMASWAP_LOG_JSON:-false}"
      LLAMASWAP_AUDIO_TMP_DIR: "${LLAMASWAP_AUDIO_TMP_DIR:-/tmp/llamaswap-audio}"
      LLAMASWAP_API_KEY: "${LLAMASWAP_API_KEY:-}"
      LLAMASWAP_ADMIN_KEY: "${LLAMASWAP_ADMIN_KEY:-}"
      LLAMASWAP_MAX_CONCURRENCY: "${LLAMASWAP_MAX_CONCURRENCY:-0}"
      # Re-emit tool calls the backend refused because their name was not
      # declared (see app/tool_reconcile.py); false disables the layer.
      LLAMASWAP_TOOL_RECONCILE: "${LLAMASWAP_TOOL_RECONCILE:-true}"
      LLAMASWAP_TOOL_RECONCILE_MIN_RATIO: "${LLAMASWAP_TOOL_RECONCILE_MIN_RATIO:-0.75}"
      # Deploy-time pins for the optional Strata backends. Empty = the
      # entrypoint sniffs them off the mounted install at startup
      # (scripts/docker-entrypoint.sh); set them explicitly only if the
      # sniff cannot match your install's layout.
      STRATA_TERMINAL_VERSION: "${STRATA_TERMINAL_VERSION:-}"
      STRATA_ENGINE_DIR: "${STRATA_ENGINE_DIR:-}"
      # Install/refresh llamaswap's opencode provider + skills in the host
      # config mounted below. Set LLAMASWAP_INSTALL_OPENCODE=false to opt out.
      LLAMASWAP_INSTALL_OPENCODE: "${LLAMASWAP_INSTALL_OPENCODE:-true}"
      LLAMASWAP_OPENCODE_CONFIG_DIR: "/host-opencode-config"
      LLAMASWAP_OPENCODE_BASE_URL: "${LLAMASWAP_OPENCODE_BASE_URL:-http://localhost:9090/v1}"
    volumes:
      # Overlay the checkout's proxy code, backend configs and entrypoint
      # on top of the image. The Hub image is only rebuilt on release, so
      # without this an older image keeps its baked-in Strata paths (e.g.
      # an absolute ~/.local/share/.../terminal/current launcher path and
      # no ${...} env expansion) even though the repo already fixed them.
      # Read-only: the image provides all compiled binaries and deps.
      - ./app:/app/app:ro
      - ./backend:/app/backend:ro
      - ./scripts/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      # opencode integration: the bundle + installer, plus the host config
      # dir the entrypoint merges into (provider + artist/music-composer
      # skills). Override the target with OPENCODE_CONFIG_DIR.
      - ./opencode:/app/opencode:ro
      - ./scripts/install-opencode.py:/app/scripts/install-opencode.py:ro
      - ${OPENCODE_CONFIG_DIR:-$HOME/.config/opencode}:/host-opencode-config
      # Model weights on host (/opt/models). rw because the optional
      # models-init services below download into it. Also serves the
      # Strata shards/packs/MTP — they live under the same shared root
      # (STRATA_MODELS-style separation is only needed by the stacked
      # local deployment, docker-compose.strata.yml).
      - ${MODEL_ROOT:-/opt/models}:/opt/models
      # Staging area for multipart audio uploads (audio.cpp transcriptions).
      - /tmp/llamaswap-audio:/tmp/llamaswap-audio
      # Optional Strata install (terminal bundle + engine components),
      # read-only at the fixed container path the backend YAMLs reference.
      # Absent install: docker creates an empty dir, the entrypoint skips
      # its sniff and the two strata models simply sit unusable in the
      # registry, like any backend with missing weights.
      - ${STRATA_HOME:-$HOME/.local/share/strata}:/opt/strata/.local/share/strata:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  # One-shot weight download (tts/asr/music default bundle set) into the
  # shared model root. Not wired as a dependency — run it explicitly before
  # or after `up` (llamaswap boots immediately and just 404s/503s roles
  # whose weights are still missing):
  #   docker compose -f docker-compose.hub.yml run --rm models-init
  # Requires this file to be run from a checkout of the llamaswap
  # repository (it mounts ./scripts).
  models-init:
    image: alpine:3.20
    container_name: llamaswap-hub-models-init
    init: true
    restart: "no"
    environment:
      MODEL_ROOT: /opt/models
    volumes:
      - ./scripts:/scripts:ro
      - ${MODEL_ROOT:-/opt/models}:/opt/models
    command:
      - /bin/sh
      - -c
      - "apk add --no-cache curl aria2 >/dev/null 2>&1 && exec sh /scripts/download-models.sh"
