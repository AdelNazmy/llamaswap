services:
  llamaswap:
    image: llamaswap:local
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        llamacpp-bin: /opt/llama.cpp/build/bin
        llamacpp_prism-bin: /opt/llama_prism.cpp/build/bin
        # Radiance engine (qwen3.8-27b backend): the engine binary from its
        # install dir, and the front launcher + fleet config from its source
        # tree (that .dockerignore keeps build*/.git out of the context).
        # They are stamped into the image at /opt/radiance (engine bin/ +
        # start.sh + qwen.yaml side by side).
        radiance-bin: /opt/radiance
        radiance-src: /home/adnathan/radiance
        # LLVM OpenMP runtime for the radiance CPU kernel plugins
        # (share/radiance/kernels/libavx.so, libref.so), which NEEDED the
        # unversioned libomp.so. The pinned ROCm 7.2.3 stage does not ship
        # it, so it is stamped from the host's ROCm LLVM dir (same 7.2.3
        # release the host binaries were built against). Path follows the
        # ROCm 7.2.3 host layout; adjust for other installs.
        rocm-llvm-libs: /opt/rocm/core-10.2/lib/llvm/lib/x86_64-unknown-linux-gnu
    init: true
    container_name: llamaswap
    restart: unless-stopped
    ports:
      # Published twice: the repo-default port (overridable via
      # LLAMASWAP_PORT) plus the legacy graphify port 9090. The container
      # itself always listens on 11434.
      - ${LLAMASWAP_PORT:-11434}:11434
      - 9090:11434
      - 1234:11434
    environment:
      # Each value uses ${VAR:-default} so a .env file (or shell env) can
      # override any of them. Defaults mirror app/config.py; see .env.example.
      LLAMASWAP_HOST: "${LLAMASWAP_HOST:-0.0.0.0}"
      LLAMASWAP_PORT: "${LLAMASWAP_PORT:-11434}"
      LLAMASWAP_BACKEND_DIR: "${LLAMASWAP_BACKEND_DIR:-backend}"
      LLAMASWAP_STARTUP_TIMEOUT: "${LLAMASWAP_STARTUP_TIMEOUT:-600.0}"
      LLAMASWAP_STOP_TIMEOUT: "${LLAMASWAP_STOP_TIMEOUT:-30.0}"
      LLAMASWAP_HEALTH_INTERVAL: "${LLAMASWAP_HEALTH_INTERVAL:-1.0}"
      # Unload the chat LLM AND audio (tts/asr) servers after this many
      # idle seconds; only the embedding server stays up.
      LLAMASWAP_IDLE_UNLOAD_SECONDS: "${LLAMASWAP_IDLE_UNLOAD_SECONDS:-300}"
      LLAMASWAP_IDLE_UNLOAD_AUDIO_SECONDS: "${LLAMASWAP_IDLE_UNLOAD_AUDIO_SECONDS:-}"
      LLAMASWAP_IDLE_UNLOAD_IMAGE_SECONDS: "${LLAMASWAP_IDLE_UNLOAD_IMAGE_SECONDS:-}"
      LLAMASWAP_IDLE_UNLOAD_MUSIC_SECONDS: "${LLAMASWAP_IDLE_UNLOAD_MUSIC_SECONDS:-}"
      # While tts AND asr are both loaded, serve only the smallest chat
      # LLM (weights-file size) instead of the requested one.
      LLAMASWAP_AUDIO_VRAM_GUARD: "${LLAMASWAP_AUDIO_VRAM_GUARD:-true}"
      # Reject TTS/ASR (409) while a big chat LLM (anything other than the
      # smallest by weights-file size) is loaded.
      LLAMASWAP_BLOCK_AUDIO_ON_BIG_LLM: "${LLAMASWAP_BLOCK_AUDIO_ON_BIG_LLM:-true}"
      # Unload TTS/ASR when a big chat LLM is requested (embedding stays up).
      LLAMASWAP_UNLOAD_AUDIO_ON_BIG_LLM: "${LLAMASWAP_UNLOAD_AUDIO_ON_BIG_LLM:-true}"
      LLAMASWAP_UNLOAD_ON_IMAGE: "${LLAMASWAP_UNLOAD_ON_IMAGE:-true}"
      LLAMASWAP_UNLOAD_IMAGE_ON_LLM: "${LLAMASWAP_UNLOAD_IMAGE_ON_LLM:-true}"
      LLAMASWAP_UNLOAD_IMAGE_ON_AUDIO: "${LLAMASWAP_UNLOAD_IMAGE_ON_AUDIO:-true}"
      LLAMASWAP_UNLOAD_ON_MUSIC: "${LLAMASWAP_UNLOAD_ON_MUSIC:-true}"
      LLAMASWAP_UNLOAD_MUSIC_ON_LLM: "${LLAMASWAP_UNLOAD_MUSIC_ON_LLM:-true}"
      LLAMASWAP_UNLOAD_MUSIC_ON_AUDIO: "${LLAMASWAP_UNLOAD_MUSIC_ON_AUDIO:-true}"
      LLAMASWAP_UNLOAD_IMAGE_ON_MUSIC: "${LLAMASWAP_UNLOAD_IMAGE_ON_MUSIC:-true}"
      # Boot the embedding server at startup (octen-embedding). Default
      # false: launch it on first use like the chat/TTS/ASR/image endpoints
      # (nothing holds VRAM until an embedding request arrives).
      LLAMASWAP_EMBEDDING_AUTO_START: "${LLAMASWAP_EMBEDDING_AUTO_START:-false}"
      LLAMASWAP_LOG_LEVEL: "${LLAMASWAP_LOG_LEVEL:-INFO}"
      LLAMASWAP_LOG_JSON: "${LLAMASWAP_LOG_JSON:-false}"
      LLAMASWAP_AUDIO_TMP_DIR: "${LLAMASWAP_AUDIO_TMP_DIR:-/tmp/llamaswap-audio}"
      # Where per-model config files for structured-config chat backends
      # (strata serve --profile) are rendered before launch.
      LLAMASWAP_LLM_TMP_DIR: "${LLAMASWAP_LLM_TMP_DIR:-/tmp/llamaswap-llm}"
      LLAMASWAP_API_KEY: "${LLAMASWAP_API_KEY:-}"
      LLAMASWAP_ADMIN_KEY: "${LLAMASWAP_ADMIN_KEY:-}"
      LLAMASWAP_MAX_CONCURRENCY: "${LLAMASWAP_MAX_CONCURRENCY:-0}"
      # Re-emit tool calls the backend refused because their name was not
      # declared (see app/tool_reconcile.py); false disables the layer, and
      # the ratio raises the bar for trusting a fuzzy name match.
      LLAMASWAP_TOOL_RECONCILE: "${LLAMASWAP_TOOL_RECONCILE:-true}"
      LLAMASWAP_TOOL_RECONCILE_MIN_RATIO: "${LLAMASWAP_TOOL_RECONCILE_MIN_RATIO:-0.75}"
      # On an upstream context-window overflow 400, drop the oldest turns
      # and retry upstream instead of dead-ending the client; false passes
      # the 400 through unchanged (see app/proxy.py).
      LLAMASWAP_CONTEXT_TRIM: "${LLAMASWAP_CONTEXT_TRIM:-true}"
      LLAMASWAP_CONTEXT_TRIM_MARGIN: "${LLAMASWAP_CONTEXT_TRIM_MARGIN:-1024}"
    volumes:
      - /opt/models:/opt/models:ro
      # Radiance model weights (the .rad fleet models pinned by
      # /opt/radiance/qwen.yaml). Host-only path; ignored by other backends.
      - /opt/rad_models:/opt/rad_models:ro
      - ./backend:/app/backend
      # Token usage totals (data/llamaswap_tokens.db) survive recreation.
      - ./data:/app/data
    # GPU exposure is vendor-specific (the stamped host binaries are built
    # for exactly one vendor) — stack the matching overlay, which
    # scripts/deploy.sh does automatically after detecting the host's GPU:
    #   docker-compose.gpu-nvidia.yml — NVIDIA: device reservations
    #   docker-compose.gpu-rocm.yml   — AMD/ROCm: /dev/kfd + /dev/dri +
    #                                           the host ROCm install
    # Without a GPU overlay the stack still runs, but the GPU backends
    # start CPU-only.
