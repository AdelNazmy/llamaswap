# Text chat model: bonsai-27b)
name: bonsai-27b
description: "bonsai-27b, text chat 130k"
command:
  binary: /opt/llama.cpp/build/bin/llama-prism-server
  args:
    - "--model"
    - "/opt/models/Ternary-Bonsai-2-27B-PQ2_0.gguf"
    - "--ctx-size"
    - "262144"
    - "--n-gpu-layers"
    - "99"
    - "--flash-attn"
    - "on"
    - "--cache-type-k"
    - "q8_0"
    - "--cache-type-v"
    - "q8_0"
    - "--temp"
    - "1.0"
    - "--top-p"
    - "0.95"
    - "--top-k"
    - "20"
    - "--min-p"
    - "0.05"
    - "--presence-penalty"
    - "0.0"
    - "--reasoning-budget"
    - "1024"
    - "--threads"
    - "14"
    - "--parallel"
    - "1"
    - "-lv"
    - "4"
    - "--log-colors"
    - "on"
  env:
    CUDA_VISIBLE_DEVICES: "0"
# internal llama-server binding (enforced by the proxy; one model at a time)
host: 127.0.0.1
port: 8111
meta:
  context_length: 262144
  family: qwen
  capabilities: [chat]
