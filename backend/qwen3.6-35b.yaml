# Text chat model: Qwen3.6 35B MoE (IQ3_XXS)
name: qwen3.6-35b
description: "Qwen3.6 35B-A3B MoE, IQ3_XXS quant, text chat"
command:
  binary: /opt/llama.cpp/build/bin/llama-server
  args:
    - "--model"
    - "/opt/models/Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf"
    - "--ctx-size"
    - "8192"
    - "--n-gpu-layers"
    - "99"
    - "--flash-attn"
    - "on"
    - "--jinja"
    - "--batch-size"
    - "2048"
    - "--ubatch-size"
    - "512"
  env:
    CUDA_VISIBLE_DEVICES: "0"
host: 127.0.0.1
port: 8101
meta:
  context_length: 8192
  family: qwen
  capabilities: [chat]
