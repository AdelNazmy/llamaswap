# Vision-capable chat model: same Strata IQ1_M pack as
# backend/qwen3.8-flash-next-coder-iq1_m.yaml, plus the picture reader
# (bare --vision + a `vision` section in the run config). The strata
# server starts `strata-vision` beside the engine; image parts of chat
# messages are embedded by the reader (mmproj) and answered by the text
# engine.
#
# The reader needs the mmproj file and the text model path (opened
# vocab-only); both live on the model disk mounted by
# docker-compose.strata.yml. Image GENERATION is unrelated and stays on
# the sd-server tenants (role: image) — this variant only READS pictures.
#
# Same role (llm) and same port as the text-only variant: swapping between
# them is an ordinary model swap. The picture reader runs on the CPU (see
# the vision section below), so it adds no VRAM on top of the pack's
# ~15.2 GiB (meta.vram_gb covers the pack).
#
# NOTE: an engine update changes the components folder name — deploy.sh
# sniffs it into ${STRATA_ENGINE_DIR} on every deploy (deploy-time env
# expansion, see app/registry.py), so no edit is needed; the top-level
# engine itself is "component:strata-engine" and never needed one.
name: qwen3.8-flash-next-coder-iq1_m-vision
description: "Qwen3.8 Flash Next coder, 176.9B MoE 50% expert-pruned (GSQ-RCO), Strata IQ1_M pack (MTP, 128k ctx) — chat + picture reading"
command:
  # Fixed container mount (docker-compose.strata.yml) + deploy-time version
  # pin; terminal/current is deliberately NOT used — it is an absolute
  # symlink into the HOST home and dies inside the container (see the
  # text-only variant).
  binary: /opt/strata/.local/share/strata/terminal/${STRATA_TERMINAL_VERSION}/bin/strata
  args:
    - "serve"
    - "--profile"
    - "{config_path}"
    - "--offline"
    - "--shutdown-timeout"
    - "20"
  config_json:
    exe: "component:strata-engine"
    args:
      - "--vision"
      - "--native"
      - "/opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/IQ1_M/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf"
      - "--ple-gguf"
      - "/opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/IQ1_M/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00002-of-00002.gguf"
      - "--expert-profile"
      - "/opt/strata/.local/share/strata/terminal/${STRATA_TERMINAL_VERSION}/data/expert-profile-coder.bin"
      - "--expert-cache"
      - "auto"
      - "--prefill"
      - "auto"
      - "--spec"
      - "4"
      # Match the standalone launcher run ($HOME/.local/state/strata/launch/
      # coder.json): --pool-workers 13, no --spec-min-p. See the text-pack
      # yaml for the rationale.
      - "--pool-workers"
      - "13"
      - "--max-context"
      - "131072"
      - "--kv"
      - "int8"
      - "--kv-resident"
      - "32768"
      - "--mtp"
      - "/opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/STRATA/mtp/rt"
      - "--pack"
      - "/opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/STRATA/packs/coder-iq1_m"
    # The picture reader. "model" is the text gguf (vocab-only read).
    # gpu: false → the reader runs on the CPU: the pack alone takes
    # ~15.2 GiB of the 16 GB card, so the GPU reader (~1.1 GB more) would
    # not fit — and the reader on the CPU takes no VRAM (strata's own
    # sizing also puts readers on the CPU below its GPU threshold). Flip
    # to true only on a bigger card.
    vision:
      exe: /opt/strata/.local/share/strata/components/engine/${STRATA_ENGINE_DIR}/strata-vision
      mmproj: /opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/mmproj-Qwen3.8-Flash-Next-BF16.gguf
      model: /opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/IQ1_M/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf
      gpu: false
      max_tokens: 300
    log: "{config_path}.engine.log"
    # versioned terminal dir, not terminal/current (see binary, above)
    cwd: /opt/strata/.local/share/strata/terminal/${STRATA_TERMINAL_VERSION}
    tokenizer: /opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/STRATA/packs/coder-iq1_m/tokenizer
    model_name: "{name}"
    idle_unload_s: 0
    open_browser: false
    # Strata 0.1.45 leaves a quarter of max_tokens for the answer by closing
    # the thinking early; that quarter cap is what clipped the agent's reasoning
    # (thinking limited to 6144 of max_tokens 8192). Disabled: the thinking may
    # now consume the whole cap, so a long-reasoning turn can end mid-answer.
    answer_room: false
    # With the quarter-cap off a turn can now stop mid-thinking; strata then
    # closes the thinking once (</think> injected) and continues, so the turn
    # still yields an answer instead of an empty reply.
    reasoning_close_retry: true
    # #728: the stuck turns repeated whole reasoning passages; "recover" resumes
    # the same output with the low-effort instruction swapped in instead of
    # ending the reply ("stop" would truncate the turn). Not applied to
    # image-bearing prompts.
    reasoning_loop_recovery: "recover"
    # #123: cap the thinking of every request at this many tokens — the stuck
    # turns burned ~5.6k reasoning tokens before the loop detector fired; the
    # budget closes the thinking cleanly instead (reasoning_close_retry then
    # still yields an answer). A request's own reasoning_budget_tokens wins.
    reasoning_budget_tokens: 4096
  env:
    STRATA_DEFAULTS: "026"
    CUDA_VISIBLE_DEVICES: "0"
    # Strata resolves its install via $HOME; see the text-only variant.
    HOME: /opt/strata
host: 127.0.0.1
port: 8101
meta:
  context_length: 131072
  family: qwen
  capabilities: [chat, vision]
  vram_gb: 15.2
  idle_unload_seconds: 14400
