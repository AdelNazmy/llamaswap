# Vision-capable chat model: same Strata IQ1_M pack as
# backend/qwen3.8-flash-next-coder-iq1_m.yaml, plus the picture reader
# (bare --vision + a `vision` section in the run config). The strata
# server starts `strata-vision` beside the engine; image parts of chat
# messages are embedded by the reader (mmproj) and answered by the text
# engine.
#
# HOST LAYOUT: this box runs Strata from the user install under
# ~/.local/share/strata (its setup.sh), not from the docker overlay in
# docker-compose.strata.yml — docker is not installed here. The paths
# below are host paths: `terminal/current` is the installed version dir,
# and the engine / reader binaries live under components/engine/<tag>/.
# A docker deployment would need the container paths back
# (/opt/strata/... + the ${STRATA_TERMINAL_VERSION}/${STRATA_ENGINE_DIR}
# expansion from deploy.sh).
#
# The reader needs the mmproj file and the text model path (opened
# vocab-only). Image GENERATION is unrelated and stays on the sd-server
# tenants (role: image) — this variant only READS pictures.
#
# Same role (llm) and same port as the text-only variant: swapping between
# them is an ordinary model swap. On this 32 GB card the reader runs on
# the GPU (see the vision section below).
name: qwen3.8-flash-next-coder-iq1_m-vision
description: "Qwen3.8 Flash Next coder, 176.9B MoE 50% expert-pruned (GSQ-RCO), Strata IQ1_M pack (MTP, 128k ctx) — chat + picture reading"
command:
  # The `strata` launcher is a /bin/sh script that resolves its own install
  # dir, so it must stay inside the bundle. `terminal/current` is a
  # symlink to the installed version dir; it works on the host (the docker
  # overlay avoided it because its target is an absolute host path).
  binary: /opt/strata/.local/share/strata/terminal/current/bin/strata
  args:
    - "serve"
    - "--profile"
    - "{config_path}"
    - "--offline"
    - "--shutdown-timeout"
    - "20"
  config_json:
    exe: "component:strata-engine"
    # hip: this is the ROCm/HIP build of the engine (no CUDA backend here).
    backend: hip
    args:
      - "--vision"
      - "--native"
      - "/opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/models/coder-IQ1_M/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf"
      - "--ple-gguf"
      - "/opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/models/coder-IQ1_M/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00002-of-00002.gguf"
      - "--expert-profile"
      - "/opt/strata/.local/share/strata/terminal/current/data/expert-profile-coder.bin"
      - "--expert-cache"
      - "auto"
      - "--prefill"
      - "auto"
      - "--spec"
      - "4"
      # Match the standalone launcher run ($HOME/.local/state/strata/launch/
      # iq1_m-256k.json): --pool-workers 13. See the text-pack yaml for the
      # rest of the rationale.
      - "--pool-workers"
      - "13"
      - "--max-context"
      - "131072"
      - "--kv"
      - "int8"
      - "--kv-resident"
      - "32768"
      - "--mtp"
      - "/opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/mtp/rt"
      - "--pack"
      - "/opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/packs/coder-iq1_m"
      # Same reserve as the standalone profile: keeps room for the desktop
      # on this card (without it ~1.3 GiB is left with the pack resident).
      - "--vram-reserve-mib"
      - "700"
    # The picture reader. "model" is the text gguf (vocab-only read).
    # gpu: true → the HIP reader; cpu_exe is the fallback copy strata
    # starts when it decides the reader does not fit. On this 32 GB card
    # the GPU reader is proven (1.3 GiB free, measured).
    vision:
      exe: /opt/strata/.local/share/strata/components/engine/0.1.64-linux-x86_64-hip-rx9070/strata-vision-hip
      cpu_exe: /opt/strata/.local/share/strata/components/engine/0.1.64-linux-x86_64-hip-rx9070/strata-vision
      mmproj: /opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/models/mmproj-Qwen3.8-Flash-Next-BF16.gguf
      model: /opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/models/coder-IQ1_M/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf
      gpu: true
      max_tokens: 1024
    log: "{config_path}.engine.log"
    cwd: /opt/strata/.local/share/strata/terminal/current
    tokenizer: /opt/models/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M/packs/coder-iq1_m/tokenizer
    model_name: "{name}"
    idle_unload_s: 0
    open_browser: false
    # Strata 0.1.45 leaves a quarter of max_tokens for the answer by closing
    # the thinking early; that quarter cap is what clipped the agent's reasoning
    # (thinking limited to 6144 of max_tokens 8192). Disabled: the thinking may
    # now consume the whole cap, so a long-reasoning turn can end mid-answer.
    answer_room: false
    # With the quarter-cap off a turn can now stop mid-thinking; strata then
    # closes the thinking once (</think> injected) and continues, so the turn
    # still yields an answer instead of an empty reply.
    reasoning_close_retry: true
    # #728: the stuck turns repeated whole reasoning passages; "recover" resumes
    # the same output with the low-effort instruction swapped in instead of
    # ending the reply ("stop" would truncate the turn). Not applied to
    # image-bearing prompts.
    reasoning_loop_recovery: "recover"
    # #123: cap the thinking of every request at this many tokens — the stuck
    # turns burned ~5.6k reasoning tokens before the loop detector fired; the
    # budget closes the thinking cleanly instead (reasoning_close_retry then
    # still yields an answer). A request's own reasoning_budget_tokens wins.
    reasoning_budget_tokens: 4096
  env:
    STRATA_DEFAULTS: "026"
    # HIP + CUDA spelling: the engine honours both, and the CLI profile and
    # the reader share GPU 0.
    HIP_VISIBLE_DEVICES: "0"
    CUDA_VISIBLE_DEVICES: "0"
    # Strata resolves its install (~/.local/share/strata: components, bundle
    # data, state) via $HOME.
    HOME: /opt/strata
host: 127.0.0.1
port: 8101
meta:
  context_length: 153750
  family: qwen
  capabilities: [chat, vision]
  # Measured with the pack + expert cache resident on this box's 31.9 GiB
  # card (~30.6 GiB). Declared because the shards (29.6 GB + 28.8 GB; the
  # PLE table never enters VRAM) would make any file-size estimate
  # meaningless — and would wrongly disable the audio/image VRAM guards.
  vram_gb: 30.6
  idle_unload_seconds: 14400
