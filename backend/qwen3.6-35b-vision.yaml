# Vision chat model: Qwen3.6 35B MoE (IQ3_XXS) + mmproj projector
name: qwen3.6-35b-vision
description: "Qwen3.6 35B-A3B MoE, IQ3_XXS quant, multimodal chat (image + text)"
command:
  binary: /opt/llama.cpp/build/bin/llama-server
  args:
    - "--model"
    - "/opt/models/Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf"
    - "--mmproj"
    - "/opt/models/Qwen3.6-mmproj-BF16.gguf"
    - "--ctx-size"
    - "65000"
    - "--n-gpu-layers"
    - "999"
    - "--cache-type-k"
    - "q8_0"
    - "--cache-type-v"
    - "q8_0"
    - "--flash-attn"
    - "on"
    - "--parallel"
    - "1"
    - "-lv"
    - "4"
    - "--spec-type"
    - "ngram-mod"
    - "--log-colors"
    - "on"
    - "--reasoning-budget"
    - "1024"
    - "--kv-unified"
    - "--cache-idle-slots"
    - "--mmap"
    - "--mlock"
    - "--jinja"
  env:
    CUDA_VISIBLE_DEVICES: "0"
host: 127.0.0.1
port: 8101
meta:
  context_length: 65000
  family: qwen
  capabilities: [chat, vision]
