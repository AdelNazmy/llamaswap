# Text chat model: Qwen3.8 27B (Q3_K_XL)
name: qwen3.8-27b-32k
description: "Qwen3.8 27B dense, Q3_K_XL quant, optimized for 16GB VRAM"
command:
  binary: /opt/llama.cpp/build/bin/llama-server
  args:
    - "--model"
    - "/opt/models/Qwen3.8-27B-UD-Q3_K_XL.gguf"
    - "--ctx-size"
    - "32000"
    - "--n-gpu-layers"
    - "999"
    - "--cache-type-k"
    - "q4_0"
    - "--cache-type-v"
    - "q4_0"
    - "--flash-attn"
    - "on"
    - "--parallel"
    - "1"
    - "-lv"
    - "4"
    - "--spec-type"
    - "ngram-mod"
    - "--log-colors"
    - "on"
    - "--reasoning-budget"
    - "1024"
    - "--mmap"
    - "--mlock"

  env:
    CUDA_VISIBLE_DEVICES: "0"
# internal llama-server binding (enforced by the proxy; one model at a time)
host: 127.0.0.1
port: 8101
meta:
  context_length: 32000
  family: qwen
  capabilities: [chat]
